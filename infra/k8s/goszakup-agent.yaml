# On-prem Kubernetes: kubectl apply -f infra/k8s/goszakup-agent.yaml
# Секреты создаются отдельно (не хранятся в git):
#   kubectl -n goszakup create secret generic goszakup-secrets \
#     --from-literal=OWS_TOKEN=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=DATABASE_URL=postgresql://goszakup:...@postgres:5432/goszakup \
#     --from-literal=AGENT_RO_PASSWORD=... \
#     --from-literal=ANTHROPIC_API_KEY=...   # не нужен при LLM_PROVIDER=openai_compat
apiVersion: v1
kind: Namespace
metadata: { name: goszakup }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: goszakup-config, namespace: goszakup }
data:
  OWS_BASE_URL: https://ows.goszakup.gov.kz
  POSTGRES_USER: goszakup
  POSTGRES_DB: goszakup
  # on-prem LLM (vLLM/Ollama внутри кластера); для Claude: LLM_PROVIDER=anthropic
  LLM_PROVIDER: openai_compat
  OPENAI_COMPAT_BASE_URL: http://vllm:8000/v1
  OPENAI_COMPAT_MODEL: Qwen/Qwen2.5-32B-Instruct
  ANTHROPIC_MODEL: claude-opus-5-5
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: goszakup }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom: [{ configMapRef: { name: goszakup-config } }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: goszakup-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data, subPath: pg }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "goszakup"] }, periodSeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: goszakup }
spec: { selector: { app: postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: goszakup }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: registry.local/goszakup-agent-api:1.0
          envFrom:
            - configMapRef: { name: goszakup-config }
            - secretRef: { name: goszakup-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 8000 }, periodSeconds: 10 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: goszakup }
spec: { selector: { app: api }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: goszakup }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: registry.local/goszakup-agent-web:1.0
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: goszakup }
spec: { selector: { app: web }, ports: [{ port: 80 }] }
---
# Инкрементальная синхронизация OWS v3 → raw → core/mart: каждый час (SLA свежести ≤ 24 ч)
apiVersion: batch/v1
kind: CronJob
metadata: { name: ows-sync, namespace: goszakup }
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: registry.local/goszakup-agent-api:1.0
              command: ["sh", "-c", "python -m app.ingest.jobs incremental && python -m app.etl.build"]
              envFrom:
                - configMapRef: { name: goszakup-config }
                - secretRef: { name: goszakup-secrets }
